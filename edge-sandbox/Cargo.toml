[package]
name = "edge-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = "21"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
