services:
  # --- Infrastructure ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: ondc-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the Redpanda topic on startup
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: ondc-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "rpk topic create ondc_events_sanitized --brokers redpanda:9092 --partitions 3 --replicas 1 && echo 'Topic created successfully'"]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: ondc-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_DB: ondc
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ondc-postgres
    environment:
      POSTGRES_USER: ondc
      POSTGRES_PASSWORD: ondc_secret
      POSTGRES_DB: ondc_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondc -d ondc_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Application Services ---
  gateway-ingress:
    build:
      context: ./gateway-ingress
      dockerfile: Dockerfile
    container_name: ondc-gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_TOPIC: ondc_events_sanitized
      SANDBOX_SOCKET_PATH: /tmp/sandbox.sock
    volumes:
      - sandbox_socket:/tmp
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      edge-sandbox:
        condition: service_started

  edge-sandbox:
    build:
      context: ./edge-sandbox
      dockerfile: Dockerfile
    container_name: ondc-sandbox
    volumes:
      - sandbox_socket:/tmp
    environment:
      SOCKET_PATH: /tmp/sandbox.sock

  analytics-api:
    build:
      context: ./analytics-api
      dockerfile: Dockerfile
    container_name: ondc-api
    ports:
      - "8081:8081"
    environment:
      API_PORT: "8081"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: ondc
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ondc
      POSTGRES_PASSWORD: ondc_secret
      POSTGRES_DB: ondc_auth
      JWT_SECRET: change-me-in-production
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend-dashboard:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
    container_name: ondc-dashboard
    ports:
      - "5173:80"
    depends_on:
      - analytics-api

  # --- Load Testing (run manually) ---
  load-tester:
    build:
      context: ./load-tester
      dockerfile: Dockerfile
    container_name: ondc-load-tester
    environment:
      GATEWAY_URL: http://gateway-ingress:8080
      RPS: "100"
      DURATION_SECONDS: "30"
    depends_on:
      - gateway-ingress
    profiles:
      - test    # Only runs with: docker-compose --profile test up load-tester

volumes:
  redpanda_data:
  clickhouse_data:
  postgres_data:
  sandbox_socket:
